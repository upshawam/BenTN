<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BenTN Pottery - Glaze Mixing Calculator</title>
    <link rel="stylesheet" href="color-theme.css">
    <style>
        html, body {
            height: 100vh;
            overflow: hidden;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: hidden;
        }

        .container {
            max-width: 640px;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 0.75rem;
            flex-shrink: 0;
        }

        h1 {
            color: var(--primary-dark);
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .calculator-card {
            background-color: var(--surface);
            border: 2px solid var(--aqua-light);
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(26, 58, 82, 0.1);
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--aqua-light);
            border-radius: 0.75rem;
            background-color: var(--off-white);
            font-size: 1rem;
            transition: all 0.2s;
        }

        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(45, 95, 122, 0.1);
        }

        .results {
            margin-top: 2rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, var(--navy-blue), var(--ocean-blue));
            border-radius: 0.75rem;
            color: var(--off-white);
        }

        .results.hidden {
            display: none;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(160, 213, 213, 0.3);
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: 500;
            color: var(--aqua-light);
            white-space: nowrap;
            font-size: 0.95rem;
        }

        .result-value {
            display: flex;
            align-items: baseline;
            gap: 0.25rem;
            font-size: clamp(1.2rem, 5.5vw, 1.5rem);
            font-weight: 600;
            white-space: nowrap;
        }

        .result-value .unit {
            font-size: 0.95rem;
            opacity: 0.85;
        }

        .info-box {
            margin-top: 1rem;
            padding: 1rem;
            background-color: rgba(160, 213, 213, 0.15);
            border-left: 4px solid var(--turquoise);
            border-radius: 0.375rem;
        }

        .info-box p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .unit-toggle {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .unit-toggle button {
            padding: 0.75rem 1.25rem;
            border: 2px solid var(--aqua-light);
            background-color: var(--off-white);
            color: var(--text-primary);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .unit-toggle button.active {
            background-color: var(--primary);
            color: var(--off-white);
            border-color: var(--primary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 1rem;
            padding: 1.5rem;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(26, 58, 82, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            color: var(--primary-dark);
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .btn-primary, .btn-secondary, .btn-tertiary {
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--off-white);
        }

        .btn-primary:hover {
            background-color: var(--primary-light);
        }

        .btn-secondary {
            background-color: var(--accent);
            color: var(--off-white);
        }

        .btn-secondary:hover {
            background-color: var(--terracotta-light);
        }

        .btn-tertiary {
            background-color: var(--aqua-light);
            color: var(--primary-dark);
            border: 2px solid var(--aqua-light);
        }

        .btn-tertiary:hover {
            background-color: transparent;
        }

        .form-group-inline {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 480px) {
            .form-group-inline {
                grid-template-columns: 1fr;
            }
        }

        .link-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
            font-size: 1rem;
            padding: 0;
            transition: color 0.2s;
        }

        .link-btn:hover {
            color: var(--primary-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>BenTN Pottery</h1>
            <p class="subtitle">Glaze Mixing Calculator</p>
        </header>

        <div class="calculator-card">
            <div class="form-group">
                <label for="brand">Glaze Brand</label>
                <div style="display: flex; gap: 0.5rem;">
                    <select id="brand" onchange="updateRatio()" style="flex: 1;">
                        <option value="">Select a brand...</option>
                    </select>
                    <button type="button" class="btn-tertiary" onclick="openAddBrandModal()" style="padding: 0.75rem; font-size: 1.25rem;" title="Add new brand">+</button>
                </div>
            </div>

            <div class="form-group">
                <label for="powder">Glaze Powder Amount <span id="unitLabel">(lbs)</span></label>
                <input 
                    type="number" 
                    id="powder" 
                    placeholder="Enter powder weight"
                    min="0"
                    step="0.01"
                    inputmode="decimal"
                    oninput="calculateWater()"
                >
                <div class="unit-toggle" aria-label="Select unit">
                    <button type="button" id="btnLb" class="active" onclick="setUnit('lb')">Pounds (lb)</button>
                    <button type="button" id="btnG" onclick="setUnit('g')">Grams (g)</button>
                </div>
            </div>

            <div class="results hidden" id="results">
                <div class="result-row">
                    <span class="result-label">Water (g)</span>
                    <span class="result-value"><span id="waterWeightGVal">0</span><span class="unit">g</span></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Water (lb)</span>
                    <span class="result-value"><span id="waterWeightLbVal">0</span><span class="unit">lb</span></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Water (ml)</span>
                    <span class="result-value"><span id="waterVolumeVal">0</span><span class="unit">ml</span></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Mixing Ratio</span>
                    <span class="result-value" id="ratio">1:1</span>
                </div>
            </div>

                <p style="text-align: center; margin-top: 1rem;">
                    <button type="button" class="link-btn" onclick="openInfoModal()">💡 Weight vs Volume</button>
                </p>
        </div>
    </div>

    <!-- Weight vs Volume Info Modal -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💡 Weight vs Volume</h2>
                <button type="button" class="close-btn" onclick="closeInfoModal()">&times;</button>
            </div>
            <p>For best accuracy, <strong>weigh your water</strong>. A scale is more precise than volume cups.</p>
            <p style="margin-top: 1rem;"><strong>Rule of thumb:</strong></p>
            <ul style="margin-top: 0.5rem; margin-left: 1.5rem; line-height: 1.8;">
                <li>1 gram of water ≈ 1 milliliter</li>
                <li>1 pound = 453.592 grams</li>
            </ul>
            <div class="btn-group" style="margin-top: 1.5rem;">
                <button type="button" class="btn-primary" onclick="closeInfoModal()">Got it</button>
            </div>
        </div>
    </div>
    <div id="addBrandModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Brand</h2>
                <button type="button" class="close-btn" onclick="closeAddBrandModal()">&times;</button>
            </div>
            <form onsubmit="saveBrand(event)">
                <div class="form-group">
                    <label for="brandName">Brand Name *</label>
                    <input type="text" id="brandName" required placeholder="e.g., Duncan Crystals">
                </div>
                <div class="form-group">
                    <label for="brandDesc">Description</label>
                    <input type="text" id="brandDesc" placeholder="Optional notes about this brand">
                </div>
                <div class="form-group-inline">
                    <div class="form-group">
                        <label for="powderRatio">Powder Ratio *</label>
                        <input type="number" id="powderRatio" required placeholder="1" min="0.1" step="0.1" value="1">
                    </div>
                    <div class="form-group">
                        <label for="waterRatio">Water Ratio *</label>
                        <input type="number" id="waterRatio" required placeholder="1" min="0.1" step="0.1" value="1">
                    </div>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-primary">Save Brand</button>
                    <button type="button" class="btn-tertiary" onclick="closeAddBrandModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Glaze brand database
        let glazeBrands = {};
        const STORAGE_KEY = 'bentn_glaze_brands';
        const LB_TO_G = 453.59237;
        let currentUnit = 'lb'; // default to pounds for BenTN workflow

        // Load brands from glazes.json and localStorage on startup
        async function loadBrands() {
            try {
                // Try to load from glazes.json (repo source of truth)
                const response = await fetch('glazes.json');
                if (response.ok) {
                    const data = await response.json();
                    // Convert array to object keyed by ID
                    glazeBrands = {};
                    data.brands.forEach(brand => {
                        glazeBrands[brand.id] = brand;
                    });
                }
            } catch (error) {
                console.warn('Could not load glazes.json:', error);
            }

            // Load and merge any brands saved in localStorage
            const savedBrands = localStorage.getItem(STORAGE_KEY);
            if (savedBrands) {
                try {
                    const localBrands = JSON.parse(savedBrands);
                    glazeBrands = { ...glazeBrands, ...localBrands };
                } catch (error) {
                    console.warn('Could not parse saved brands:', error);
                }
            }

            // Populate the dropdown
            populateBrandDropdown();
        }

        function populateBrandDropdown() {
            const brandSelect = document.getElementById('brand');
            brandSelect.innerHTML = '<option value="">Select a brand...</option>';
            
            Object.keys(glazeBrands).forEach(id => {
                const brand = glazeBrands[id];
                const option = document.createElement('option');
                option.value = id;
                option.textContent = `${brand.name} (${brand.powderRatio}:${brand.waterRatio})`;
                brandSelect.appendChild(option);
            });
        }

        function updateRatio() {
            const brandSelect = document.getElementById('brand');
            const selectedId = brandSelect.value;
            
            if (!selectedId) {
                document.getElementById('results').classList.add('hidden');
                return;
            }
            
            calculateWater();
        }

        function calculateWater() {
            const brandSelect = document.getElementById('brand');
            const selectedId = brandSelect.value;
            const powderInput = document.getElementById('powder');
            const powderAmount = parseFloat(powderInput.value);
            
            if (!selectedId || !powderAmount || powderAmount <= 0) {
                document.getElementById('results').classList.add('hidden');
                return;
            }

            const brand = glazeBrands[selectedId];
            // Convert input to grams for calculation
            const powderInGrams = currentUnit === 'lb' ? powderAmount * LB_TO_G : powderAmount;
            const waterNeededGrams = (powderInGrams * brand.waterRatio) / brand.powderRatio;
            const waterNeededLb = waterNeededGrams / LB_TO_G;
            
            // Update results
            document.getElementById('waterWeightGVal').textContent = waterNeededGrams.toFixed(1);
            document.getElementById('waterWeightLbVal').textContent = waterNeededLb.toFixed(3);
            document.getElementById('waterVolumeVal').textContent = waterNeededGrams.toFixed(1);
            document.getElementById('ratio').textContent = `${brand.powderRatio}:${brand.waterRatio}`;
            
            // Show results
            document.getElementById('results').classList.remove('hidden');
        }

        function setUnit(unit) {
            currentUnit = unit;
            const unitLabel = document.getElementById('unitLabel');
            const powderInput = document.getElementById('powder');
            const btnLb = document.getElementById('btnLb');
            const btnG = document.getElementById('btnG');

            if (unit === 'lb') {
                unitLabel.textContent = '(lbs)';
                powderInput.step = '0.01';
                btnLb.classList.add('active');
                btnG.classList.remove('active');
            } else {
                unitLabel.textContent = '(grams)';
                powderInput.step = '1';
                btnG.classList.add('active');
                btnLb.classList.remove('active');
            }
            calculateWater();
        }

        function openAddBrandModal() {
            document.getElementById('addBrandModal').classList.add('show');
        }

        function closeAddBrandModal() {
            document.getElementById('addBrandModal').classList.remove('show');
            // Clear form
            document.getElementById('brandName').value = '';
            document.getElementById('brandDesc').value = '';
            document.getElementById('powderRatio').value = '1';
            document.getElementById('waterRatio').value = '1';
        }

        function openInfoModal() {
            document.getElementById('infoModal').classList.add('show');
        }

        function closeInfoModal() {
            document.getElementById('infoModal').classList.remove('show');
        }

        function saveBrand(event) {
            event.preventDefault();
            
            const name = document.getElementById('brandName').value.trim();
            const desc = document.getElementById('brandDesc').value.trim();
            const powderRatio = parseFloat(document.getElementById('powderRatio').value);
            const waterRatio = parseFloat(document.getElementById('waterRatio').value);

            if (!name || !powderRatio || !waterRatio) {
                alert('Please fill in all required fields');
                return;
            }

            // Create unique ID from name (lowercase, no spaces)
            const id = name.toLowerCase().replace(/\s+/g, '_');

            // Add to brands object
            glazeBrands[id] = {
                id: id,
                name: name,
                powderRatio: powderRatio,
                waterRatio: waterRatio,
                description: desc || ''
            };

            // Save to localStorage
            localStorage.setItem(STORAGE_KEY, JSON.stringify(glazeBrands));

            // Update dropdown and close modal
            populateBrandDropdown();
            closeAddBrandModal();

            // Show success message
            alert(`Brand "${name}" added successfully! Don't forget to export and commit to the repo.`);
        }

        // Close modal when clicking outside
        document.addEventListener('DOMContentLoaded', () => {
            loadBrands();
            setUnit('lb');
        });

        const modal = document.getElementById('addBrandModal');
        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeAddBrandModal();
            });
        }
    </script>
</body>
</html>
