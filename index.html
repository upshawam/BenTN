<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2d5f7a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BenTN Glaze">
    <title>BenTN Pottery - Glaze Mixing Calculator</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="color-theme.css">
    <style>
        html, body {
            height: 100vh;
            overflow: hidden;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: hidden;
        }

        .container {
            max-width: 640px;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: visible;
        }

        header {
            text-align: center;
            margin-top: 1rem;
            margin-bottom: 0.75rem;
            flex-shrink: 0;
        }

        h1 {
            color: var(--primary-dark);
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .calculator-card {
            background-color: var(--surface);
            border: 2px solid var(--aqua-light);
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(26, 58, 82, 0.1);
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        select, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--aqua-light);
            border-radius: 0.75rem;
            background-color: var(--off-white);
            font-size: 1rem;
            transition: all 0.2s;
        }

        select:focus, input[type="number"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(45, 95, 122, 0.1);
        }

        .results {
            margin-top: 2rem;
            padding: 1.35rem 1.25rem 1.25rem;
            background: linear-gradient(180deg, var(--navy-blue), var(--ocean-blue));
            border-radius: 1rem;
            color: var(--off-white);
            box-shadow: 0 8px 20px rgba(26, 58, 82, 0.14);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 100%;
        }

        .results.hidden {
            display: none;
        }

        .results-title {
            width: 100%;
            margin-bottom: 0.9rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(160, 213, 213, 0.18);
            color: var(--aqua-light);
            font-size: 1.15rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .result-row {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .result-group {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 0;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
            border-radius: 0.75rem;
            padding: 0.7rem 0.75rem;
        }

        .result-group-title {
            color: var(--aqua-light);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.45rem;
            text-align: left;
        }

        .result-options {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: stretch;
            flex-wrap: nowrap;
            gap: 0.35rem;
            width: 100%;
            min-width: 0;
        }

        .result-or {
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: lowercase;
            text-align: center;
            line-height: 1;
            flex: 0 0 auto;
        }

        .result-option {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            border-radius: 0.5rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.45rem 0.5rem;
            flex: 1 1 0;
            min-width: 0;
            overflow: hidden;
        }

        .result-option-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .result-option-value {
            color: var(--off-white);
            font-size: clamp(0.72rem, 2.4vw, 1rem);
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
            min-width: 0;
            display: flex;
            align-items: baseline;
            justify-content: center;
            flex-wrap: nowrap;
        }

        .result-option-value .value-number {
            color: var(--off-white);
            font-weight: 800;
            font-size: clamp(1.15rem, 5vw, 2rem);
            line-height: 1;
            flex: 0 1 auto;
        }

        .result-option-value .value-unit {
            color: rgba(160, 213, 213, 0.9);
            font-weight: 600;
            font-size: clamp(0.65rem, 2.4vw, 0.9em);
            letter-spacing: 0.01em;
            margin-left: 0.1rem;
        }

        .result-option-value .value-sep {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            margin: 0 0.12rem;
        }

        @media (max-width: 420px) {
            body {
                padding: 0.45rem;
            }

            header {
                margin-bottom: 0.45rem;
            }

            h1 {
                font-size: 1.35rem;
            }

            .subtitle {
                font-size: 0.82rem;
            }

            .calculator-card {
                padding: 0.75rem;
            }

            .form-group {
                margin-bottom: 1rem;
            }

            label {
                margin-bottom: 0.35rem;
                font-size: 0.92rem;
            }

            select, input[type="number"], input[type="text"] {
                padding: 0.75rem;
                font-size: 0.95rem;
            }

            .powder-header-row {
                gap: 0.45rem;
            }

            .powder-header-row .unit-toggle button {
                padding: 0.5rem 0.7rem;
                font-size: 0.82rem;
            }

            .powder-input-row {
                margin-top: 0.35rem;
                gap: 0.35rem;
                justify-content: center;
            }

            .compact-fields {
                gap: 0.3rem;
            }

            #powderLbOzFields {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.35rem;
                width: min(100%, 360px);
                margin: 0 auto;
            }

            #powderLbOzFields .compact-field {
                min-width: 0;
                width: 100%;
            }

            .compact-number-input,
            .compact-number-input.gram {
                width: 100%;
                min-width: 0;
                -webkit-appearance: none;
                appearance: none;
            }

            .compact-field label {
                font-size: 0.74rem;
            }

            #powderGramField {
                width: min(100%, 180px);
                margin: 0 auto;
            }

            .compact-number-input,
            .compact-number-input.gram {
                padding: 0.42rem 0.3rem;
                font-size: 0.88rem;
            }

            .action-buttons {
                margin-top: 0.55rem;
                gap: 0.4rem;
            }

            .btn-danger,
            .btn-primary {
                padding: 0.65rem 0.85rem !important;
                font-size: 0.92rem;
            }

            .results {
                margin-top: 1.25rem;
                padding: 0.95rem 0.75rem 0.85rem;
            }

            .result-group {
                padding: 0.55rem 0.5rem;
            }

            .result-group-title {
                font-size: 0.78rem;
                margin-bottom: 0.28rem;
            }

            .result-option {
                padding: 0.35rem 0.3rem;
            }

            .result-or {
                font-size: 0.7rem;
            }
        }

        .info-box p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .unit-toggle {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .unit-toggle button {
            padding: 0.75rem 1.25rem;
            border: 2px solid var(--aqua-light);
            background-color: var(--off-white);
            color: var(--text-primary);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .unit-toggle button.active {
            background-color: var(--primary);
            color: var(--off-white);
            border-color: var(--primary);
        }

        .powder-input-row {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            width: 100%;
        }

        .powder-header-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .powder-header-row label {
            margin-bottom: 0;
        }

        .powder-header-row .unit-toggle {
            margin-top: 0;
            flex-shrink: 0;
        }

        .powder-header-row .unit-toggle button {
            padding: 0.65rem 0.95rem;
            font-size: 0.92rem;
        }

        .compact-fields {
            display: flex;
            align-items: flex-end;
            gap: 0.4rem;
            width: auto;
            min-width: auto;
        }

        #powderLbOzFields .compact-field {
            flex: 0 0 auto;
        }

        #powderGramField {
            justify-content: center;
        }

        .compact-field {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .compact-field label {
            font-size: 0.86rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .compact-number-input {
            width: 96px;
            padding: 0.55rem 0.5rem;
            font-size: 0.95rem;
            text-align: center;
        }

        .compact-number-input.gram {
            width: 118px;
        }

        .action-buttons {
            margin-top: 0.7rem;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-danger {
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            background-color: #c43b3b;
            color: var(--off-white);
            transition: all 0.2s;
        }

        .btn-danger:hover {
            background-color: #a93131;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 1rem;
            padding: 1.5rem;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(26, 58, 82, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            color: var(--primary-dark);
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .btn-primary, .btn-secondary, .btn-tertiary {
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--off-white);
        }

        .btn-primary:hover {
            background-color: var(--primary-light);
        }

        .btn-secondary {
            background-color: var(--accent);
            color: var(--off-white);
        }

        .btn-secondary:hover {
            background-color: var(--terracotta-light);
        }

        .btn-tertiary {
            background-color: var(--aqua-light);
            color: var(--primary-dark);
            border: 2px solid var(--aqua-light);
        }

        .btn-tertiary:hover {
            background-color: transparent;
        }

        .form-group-inline {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .amount-fields-inline {
            display: flex;
            flex-wrap: nowrap;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .amount-fields-inline .form-group {
            margin-bottom: 0;
            flex: 1 1 0;
            min-width: 0;
        }

        .amount-fields-inline .form-group label {
            white-space: nowrap;
            font-size: 0.9rem;
            line-height: 1.2;
        }

        .amount-fields-inline input[type="number"] {
            padding: 0.85rem;
            font-size: 0.95rem;
            width: 100%;
            min-width: 0;
        }

        @media (max-width: 480px) {
            .form-group-inline {
                grid-template-columns: 1fr;
            }

            .amount-fields-inline {
                gap: 0.5rem;
            }

            .amount-fields-inline .form-group label {
                font-size: 0.85rem;
            }
        }

        .link-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
            font-size: 1rem;
            padding: 0;
            transition: color 0.2s;
        }

        .link-btn:hover {
            color: var(--primary-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>BenTN Pottery</h1>
            <p class="subtitle">Glaze Mixing Calculator</p>
        </header>

        <div class="calculator-card">
            <div class="form-group">
                <label for="brand">Glaze</label>
                <div style="display: flex; gap: 0.5rem;">
                    <select id="brand" onchange="calculateWater()" style="flex: 1;">
                        <option value="">Select a glaze...</option>
                    </select>
                    <button type="button" class="btn-tertiary" onclick="openAddBrandModal()" style="padding: 0.75rem; font-size: 1.25rem;" title="Add new brand">+</button>
                </div>
            </div>

            <div class="form-group">
                <div class="powder-header-row">
                    <label>Enter Powder Amount</label>
                    <div class="unit-toggle" aria-label="Select dry glaze input unit">
                        <button type="button" id="btnPowderLbOz" class="active" onclick="setPowderInputUnit('lb-oz')">lbs</button>
                        <button type="button" id="btnPowderG" onclick="setPowderInputUnit('g')">g</button>
                    </div>
                </div>
                <div class="powder-input-row">
                    <div id="powderLbOzFields" class="compact-fields" style="display: flex;">
                        <div class="compact-field">
                            <label for="powderLb">lb</label>
                            <input 
                                type="number" 
                                id="powderLb" 
                                class="compact-number-input"
                                placeholder="0"
                                min="0"
                                step="0.1"
                                inputmode="decimal"
                            >
                        </div>
                        <div class="compact-field">
                            <label for="powderOz">oz</label>
                            <input 
                                type="number" 
                                id="powderOz" 
                                class="compact-number-input"
                                placeholder="0"
                                min="0"
                                max="15.999"
                                step="0.1"
                                inputmode="decimal"
                            >
                        </div>
                    </div>
                    <div id="powderGramField" class="compact-fields" style="display: none;">
                        <div class="compact-field">
                            <label for="powderG">g</label>
                            <input 
                                type="number" 
                                id="powderG" 
                                class="compact-number-input gram"
                                placeholder="0"
                                min="0"
                                step="1"
                                inputmode="decimal"
                            >
                        </div>
                    </div>
                </div>
                <div class="action-buttons">
                    <button type="button" id="clearBtn" class="btn-danger" onclick="clearCalculation()" style="display: none;">Clear</button>
                    <button type="button" class="btn-primary" onclick="calculateWater()" style="padding: 0.85rem 1.15rem; white-space: nowrap;">Calculate</button>
                </div>
            </div>

            <div class="results hidden" id="results">
                <div class="results-title">Water needed</div>
                <div class="result-row">
                    <div class="result-group">
                        <div class="result-group-title">Weight</div>
                        <div class="result-options">
                            <div class="result-option">
                                <span class="result-option-value" id="waterWeightLbOzContainer">0 oz</span>
                            </div>
                            <div class="result-or">or</div>
                            <div class="result-option">
                                <span class="result-option-value" id="waterWeightGVal">0 g</span>
                            </div>
                        </div>
                    </div>
                    <div class="result-group">
                        <div class="result-group-title">Volume</div>
                        <div class="result-options">
                            <div class="result-option">
                                <span class="result-option-value" id="waterVolumeMlVal">0 mL</span>
                            </div>
                            <div class="result-or">or</div>
                            <div class="result-option">
                                <span class="result-option-value" id="waterVolumeCupsVal">0.00 cups</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="addBrandModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Manage Glazes</h2>
                <button type="button" class="close-btn" onclick="closeAddBrandModal()">&times;</button>
            </div>
            <form onsubmit="saveBrand(event)">
                <div class="form-group">
                    <label for="glazeEntryName">Glaze Name *</label>
                    <input type="text" id="glazeEntryName" required placeholder="e.g., KY Mudworks - Stonewash">
                </div>
                <div class="amount-fields-inline">
                    <div class="form-group">
                        <label for="singlePowderAmt">Dry Mix Amount (lb) *</label>
                        <input type="number" id="singlePowderAmt" required placeholder="e.g., 10" min="0.1" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="singleWaterAmt">Water Amount (lb) *</label>
                        <input type="number" id="singleWaterAmt" required placeholder="e.g., 12" min="0.1" step="0.1">
                    </div>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-primary">Add</button>
                    <button type="button" class="btn-tertiary" onclick="closeAddBrandModal()">Cancel</button>
                </div>
                <div class="form-group" style="margin-top: 1rem;">
                    <label for="removeGlazeEntry">Remove Existing Glaze</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <select id="removeGlazeEntry" style="flex: 1;">
                            <option value="">Select glaze to remove...</option>
                        </select>
                        <button type="button" class="btn-secondary" onclick="removeSelectedGlazeEntry()">Remove</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Glaze brand database
        let glazeBrands = {};
        const STORAGE_KEY = 'bentn_glaze_brands';
        const LB_TO_G = 453.59237;
        let powderInputUnit = 'lb-oz';

        // Load brands from glazes.json and localStorage on startup
        async function loadBrands() {
            try {
                // Try to load from glazes.json (repo source of truth)
                const response = await fetch('glazes.json');
                if (response.ok) {
                    const data = await response.json();
                    // Convert array to object keyed by ID
                    glazeBrands = {};
                    data.brands.forEach(brand => {
                        glazeBrands[brand.id] = brand;
                    });
                }
            } catch (error) {
                console.warn('Could not load glazes.json:', error);
            }

            // Load and merge any brands saved in localStorage
            const savedBrands = localStorage.getItem(STORAGE_KEY);
            if (savedBrands) {
                try {
                    const localBrands = JSON.parse(savedBrands);
                    glazeBrands = { ...glazeBrands, ...localBrands };
                } catch (error) {
                    console.warn('Could not parse saved brands:', error);
                }
            }

            // Populate the dropdown
            populateBrandDropdown();
        }

        function populateBrandDropdown() {
            const brandSelect = document.getElementById('brand');
            brandSelect.innerHTML = '<option value="">Select a glaze...</option>';
            
            Object.keys(glazeBrands).forEach(id => {
                const brand = glazeBrands[id];

                if (brand.glazes && brand.glazes.length > 0) {
                    brand.glazes.forEach((glaze, glazeIndex) => {
                        const option = document.createElement('option');
                        option.value = `${id}::${glazeIndex}`;
                        option.textContent = `${brand.name} - ${glaze.name} (${glaze.waterAmount} water : ${glaze.powderAmount} dry)`;
                        brandSelect.appendChild(option);
                    });
                    return;
                }

                if (brand.powderRatio && brand.waterRatio) {
                    const option = document.createElement('option');
                    option.value = `${id}::legacy`;
                    option.textContent = brand.name;
                    brandSelect.appendChild(option);
                }
            });

            populateRemoveGlazeDropdown();
        }

        function populateRemoveGlazeDropdown() {
            const removeSelect = document.getElementById('removeGlazeEntry');
            if (!removeSelect) return;

            removeSelect.innerHTML = '<option value="">Select glaze to remove...</option>';

            Object.keys(glazeBrands).forEach(id => {
                const brand = glazeBrands[id];

                if (brand.glazes && brand.glazes.length > 0) {
                    brand.glazes.forEach((glaze, glazeIndex) => {
                        const option = document.createElement('option');
                        option.value = `${id}::${glazeIndex}`;
                        option.textContent = `${brand.name} - ${glaze.name} (${glaze.waterAmount} water : ${glaze.powderAmount} dry)`;
                        removeSelect.appendChild(option);
                    });
                    return;
                }

                if (brand.powderRatio && brand.waterRatio) {
                    const option = document.createElement('option');
                    option.value = `${id}::legacy`;
                    option.textContent = brand.name;
                    removeSelect.appendChild(option);
                }
            });
        }

        function calculateWater() {
            const clearBtn = document.getElementById('clearBtn');
            const brandSelect = document.getElementById('brand');
            const selectedValue = brandSelect.value;
            const powderLb = parseFloat(document.getElementById('powderLb').value) || 0;
            const powderOz = parseFloat(document.getElementById('powderOz').value) || 0;
            const powderG = parseFloat(document.getElementById('powderG').value) || 0;

            let powderInGrams = 0;
            if (powderInputUnit === 'lb-oz') {
                const totalPowderLb = powderLb + (powderOz / 16);
                powderInGrams = totalPowderLb * LB_TO_G;
            } else {
                powderInGrams = powderG;
            }
            
            if (!selectedValue || powderInGrams <= 0) {
                document.getElementById('results').classList.add('hidden');
                clearBtn.style.display = 'none';
                return;
            }

            const [selectedBrandId, selectedGlazeIndex] = selectedValue.split('::');
            const brand = glazeBrands[selectedBrandId];
            if (!brand) {
                document.getElementById('results').classList.add('hidden');
                clearBtn.style.display = 'none';
                return;
            }

            let waterRatio = 0;
            let powderRatio = 0;

            if (selectedGlazeIndex === 'legacy' && brand.powderRatio && brand.waterRatio) {
                powderRatio = brand.powderRatio;
                waterRatio = brand.waterRatio;
            } else if (brand.glazes && brand.glazes[parseInt(selectedGlazeIndex)] ) {
                const glaze = brand.glazes[parseInt(selectedGlazeIndex)];
                waterRatio = glaze.waterAmount;
                powderRatio = glaze.powderAmount;
            }

            if (!powderRatio || !waterRatio) {
                document.getElementById('results').classList.add('hidden');
                clearBtn.style.display = 'none';
                return;
            }
            
            const waterNeededGrams = (powderInGrams * waterRatio) / powderRatio;
            const waterNeededLb = waterNeededGrams / LB_TO_G;
            const waterVolumeMl = waterNeededGrams;
            const waterVolumeCups = waterVolumeMl / 236.588;
            
            // Convert pounds to lb + oz format
            const wholeLbs = Math.floor(waterNeededLb);
            const remainingGrams = waterNeededGrams - (wholeLbs * LB_TO_G);
            const oz = remainingGrams / 28.3495; // 1 oz = 28.3495 grams
            
            let lbOzDisplay;
            if (wholeLbs > 0) {
                lbOzDisplay = `<span class="value-number">${wholeLbs}</span><span class="value-unit">lb</span><span class="value-sep"> </span><span class="value-number">${oz.toFixed(1)}</span><span class="value-unit">oz</span>`;
            } else {
                lbOzDisplay = `<span class="value-number">${oz.toFixed(1)}</span><span class="value-unit">oz</span>`;
            }
            
            // Update results
            document.getElementById('waterVolumeMlVal').innerHTML = `<span class="value-number">${waterVolumeMl.toFixed(0)}</span><span class="value-unit">mL</span>`;
            document.getElementById('waterVolumeCupsVal').innerHTML = `<span class="value-number">${waterVolumeCups.toFixed(2)}</span><span class="value-unit">cups</span>`;
            document.getElementById('waterWeightGVal').innerHTML = `<span class="value-number">${waterNeededGrams.toFixed(1)}</span><span class="value-unit">g</span>`;
            document.getElementById('waterWeightLbOzContainer').innerHTML = lbOzDisplay;
            
            // Show results
            document.getElementById('results').classList.remove('hidden');
            clearBtn.style.display = 'inline-block';
        }

        function setPowderInputUnit(unit) {
            powderInputUnit = unit;
            const btnPowderLbOz = document.getElementById('btnPowderLbOz');
            const btnPowderG = document.getElementById('btnPowderG');
            const powderLbOzFields = document.getElementById('powderLbOzFields');
            const powderGramField = document.getElementById('powderGramField');

            if (unit === 'lb-oz') {
                btnPowderLbOz.classList.add('active');
                btnPowderG.classList.remove('active');
                powderLbOzFields.style.display = 'flex';
                powderGramField.style.display = 'none';
                document.getElementById('powderG').value = '';
            } else {
                btnPowderG.classList.add('active');
                btnPowderLbOz.classList.remove('active');
                powderLbOzFields.style.display = 'none';
                powderGramField.style.display = 'block';
                document.getElementById('powderLb').value = '';
                document.getElementById('powderOz').value = '';
            }

            calculateWater();
        }

        function clearCalculation() {
            document.getElementById('clearBtn').style.display = 'none';
            document.getElementById('powderLb').value = '';
            document.getElementById('powderOz').value = '';
            document.getElementById('powderG').value = '';
            document.getElementById('brand').value = '';
            document.getElementById('results').classList.add('hidden');
        }

        function openAddBrandModal() {
            document.getElementById('addBrandModal').classList.add('show');
            document.getElementById('glazeEntryName').value = '';
            document.getElementById('singlePowderAmt').value = '';
            document.getElementById('singleWaterAmt').value = '';
            populateRemoveGlazeDropdown();
        }

        function closeAddBrandModal() {
            document.getElementById('addBrandModal').classList.remove('show');
        }

        function saveBrand(event) {
            event.preventDefault();

            const fullGlazeName = document.getElementById('glazeEntryName').value.trim();
            const powderAmt = parseFloat(document.getElementById('singlePowderAmt').value);
            const waterAmt = parseFloat(document.getElementById('singleWaterAmt').value);

            if (!fullGlazeName || !powderAmt || !waterAmt) {
                alert('Please fill in glaze name, dry mix amount, and water amount.');
                return;
            }

            const nameParts = fullGlazeName.split(' - ');
            if (nameParts.length < 2) {
                alert('Use format: Brand - Glaze (example: KY Mudworks - Stonewash)');
                return;
            }

            const brandName = nameParts[0].trim();
            const glazeName = nameParts.slice(1).join(' - ').trim();
            const brandId = brandName.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');

            if (!glazeBrands[brandId]) {
                glazeBrands[brandId] = {
                    id: brandId,
                    name: brandName,
                    glazes: []
                };
            }

            const targetBrand = glazeBrands[brandId];

            if (!targetBrand.glazes) {
                targetBrand.glazes = [];
            }

            const existingGlazeIndex = targetBrand.glazes.findIndex(
                glaze => glaze.name.toLowerCase() === glazeName.toLowerCase()
            );

            if (existingGlazeIndex >= 0) {
                targetBrand.glazes[existingGlazeIndex] = {
                    name: glazeName,
                    powderAmount: powderAmt,
                    waterAmount: waterAmt
                };
            } else {
                targetBrand.glazes.push({
                    name: glazeName,
                    powderAmount: powderAmt,
                    waterAmount: waterAmt
                });
            }

            // Save to localStorage
            localStorage.setItem(STORAGE_KEY, JSON.stringify(glazeBrands));

            // Update dropdowns and close modal
            populateBrandDropdown();
            closeAddBrandModal();
            alert(`Added: ${brandName} - ${glazeName}`);
        }

        function removeSelectedGlazeEntry() {
            const removeSelect = document.getElementById('removeGlazeEntry');
            const selectedValue = removeSelect.value;

            if (!selectedValue) {
                alert('Select a glaze to remove first.');
                return;
            }

            const [brandId, glazeIndex] = selectedValue.split('::');
            const brand = glazeBrands[brandId];

            if (!brand) {
                return;
            }

            if (glazeIndex === 'legacy') {
                delete glazeBrands[brandId];
            } else if (brand.glazes && brand.glazes[parseInt(glazeIndex)]) {
                brand.glazes.splice(parseInt(glazeIndex), 1);

                if (brand.glazes.length === 0) {
                    delete glazeBrands[brandId];
                }
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(glazeBrands));
            populateBrandDropdown();
            document.getElementById('results').classList.add('hidden');
            removeSelect.value = '';
        }

        // Close modal when clicking outside
        document.addEventListener('DOMContentLoaded', () => {
            loadBrands();
            setPowderInputUnit('lb-oz');

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch((error) => {
                    console.warn('Service worker registration failed:', error);
                });
            }
        });

        const modal = document.getElementById('addBrandModal');
        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeAddBrandModal();
            });
        }
    </script>
</body>
</html>
